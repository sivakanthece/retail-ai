name: Deploy — Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  deploy-hf-spaces:
    name: Sync to Hugging Face Spaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space (source only, no large files)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}   # e.g. YourUsername/retail-ai
        run: |
          git config --global user.email "ci@retail-ai"
          git config --global user.name "Retail AI CI"

          # Create an orphan branch with only the current file tree
          # so we never push large model weights or git history to HF
          git checkout --orphan hf-deploy

          # Remove binary / media files HF Spaces doesn't need at build time
          find . \( \
            -name "*.pt" -o -name "*.onnx" -o \
            -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o \
            -name "*.docx" -o -name "*.xlsx" -o -name "*.pptx" -o \
            -name "*.ipynb" -o -name "*.db" -o -name "*.sqlite" \
          \) | xargs git rm --cached -f 2>/dev/null || true

          find . \( \
            -name "*.pt" -o -name "*.onnx" -o \
            -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o \
            -name "*.docx" -o -name "*.xlsx" -o -name "*.pptx" -o \
            -name "*.ipynb" -o -name "*.db" -o -name "*.sqlite" \
          \) -exec rm -f {} + 2>/dev/null || true

          # Remove dirs not needed for the Docker build
          rm -rf sample_test_images/ training/ 2>/dev/null || true

          git add -A
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M') — ${GITHUB_SHA::7}"

          git remote add hf https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
          git push hf hf-deploy:main --force
